services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # This fork publishes this image to the GitHub Container Registry for every release tag (v*)
    # (the docker job in .github/workflows/release.yml). Upstream autumn27/artex has been taken down from Docker Hub.
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. If left empty, a random setup token is printed in the startup log, and you must enter that value
      # on /setup to create the admin password (see it with docker compose logs artex).
      # If ARTEX_ADMIN_PASSWORD is set, it initializes directly with that value without /setup (at least 8 characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Allowed browser cross-origin list (comma-separated). The embedded UI is same-origin, so this is normally left empty.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # Default server-side output language (en, ko, zh, es, ja, th). If empty, the default is English. For agent output and error messages, the "Display language"
      # in the settings screen takes precedence; the server console log follows only this value.
      ARTEX_LANG: ${ARTEX_LANG:-}
    ports:
      # By default the port is published only on the host's 127.0.0.1. To connect directly from another device, set
      # ARTEX_BIND=0.0.0.0 in .env, but first be sure to finish the initial setup (admin password) and,
      # if possible, use the reverse proxy (HTTPS) setup from the README.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (including jwt.key, SQLite, etc.) to data/ in the project root.
      # You can inspect and back it up directly on the host, and it is not lost when the container is recreated.
      - ./data:/app/data
      # Mount the skills in the project root into the container (overriding the /app/skills built into the image).
      # When you edit a skill, there is no need to rebuild the image; the container reads this file on the host directly.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
