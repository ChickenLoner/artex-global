# pre-commit configuration example (official docs: https://pre-commit.com)
#
# Runs the repository CI's two deterministic merge gates at local commit time first, so a
# broken change is caught before push. If either hook's assertions fail, it exits with a
# non-zero code and the commit stops.
#
# 1) detections — only on commits that change the detection rules (detections/), the upstream
#    sources those rules pin, or the inline Sigma templates in the defense guide
#    (docs/defense-{ko,en}.md), runs the runner (detections/tests/run-all.sh) that executes the
#    eight detection tests and three gates in one go. It passes the same rule and source scope as
#    CI (.github/workflows/detections.yml) first, catching a change that edits only the rules
#    without updating the tests and layer, or one that fixes a defense template without updating
#    the guide's claims. The only requirement is Docker (each test runs isolated in a
#    container, and nothing is installed on the runner).
# 2) docs — checks that repo-internal link, image, and anchor (#heading) references in tracked
#    Markdown docs point to targets that exist (scripts/check-doc-links.py). This is the same
#    check as CI (.github/workflows/docs.yml); to match it running on every change with no paths
#    filter, the target files are not narrowed here either (always_run). Links break not only
#    when you edit a .md but also when you delete or move a file the link pointed to (an image,
#    LICENSE, etc.). It uses only the Python standard library and never touches the network, so
#    it finishes in tens of ms without Docker.
#
# Install:     pip install pre-commit && pre-commit install
# Manual run:  pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# This is a minimal example with only two hooks. To also hook in Go and web linting, add your own hooks below this.
repos:
  - repo: local
    hooks:
      - id: detections
        name: Detection rule tests x8 (Sigma, Suricata, ATT&CK, indicators, MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: Docs internal link, image, and anchor (#heading) integrity check
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
