name: detections
# On every push or PR that changes detection rules (Sigma, Suricata, ATT&CK layer), reproduction tests
# verify that the rules actually fire, convert to multiple SIEM backends, that the coverage layer
# matches the rules, that the indicators still match the upstream sources, and that they pass full
# SigmaHQ convention validation. A change that edits only the rules without updating the tests or
# layer turns red here. This workflow is what actually backs, as a merge gate, the promise made by
# CONTRIBUTING.md and detections/tests/README.md that "the eight tests mechanically enforce the
# contribution contract." The Go build, static analysis, and tests are covered by ci.yml.
# In addition to the eight tests, three non-rule gates run in the same merge gate: the harness
# registry sync check, the self-test of the host triage tool (detections/triage/artex_host_triage.py),
# and the consistency check of the inline Sigma correlation templates embedded as prose in the
# defense guide (docs/defense-{ko,en}.md). All three are separate from the eight rule tests and
# run-all.sh runs them the same way. The third gate reproduces the facts those templates assert in
# the defense guide (`sigma check` passes, splunk/eql/loki conversion, lucene/kusto correlation
# unsupported, ko/en rule bodies identical), catching the case where upstream sigma-cli or backends are upgraded and the prose silently goes stale at the merge gate.
#
# The eight tests run with Docker alone (the ubuntu-latest runner ships with Docker). The runner
# pulls the sigma-cli, scapy, suricata, and python images and runs them isolated in containers, so
# nothing is installed on the runner itself, and the rule tree and the source files the indicators
# point to are mounted read-only only, so nothing is written to the repo. Besides when files under
# detections/ change, it also runs when the source files pinned by the indicator test change: the
# User-Agent, markers, and destructive-command tokens in enrich, selfupdate, guard, and db; the
# default listen and proxy ports in cmd/artex/main.go; the MITM CA certificate filename in
# traffic/traffic.go; and the discovery-graph schema fingerprint in db/schema.sql. A source change
# that alters an indicator and silently leaves the rule and indicator lists stale is caught at the
# merge gate. Public Docker images are pulled without authentication, so you may occasionally hit
# the Docker Hub pull rate limit; re-running the job resolves it.
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # The two files read by the third gate (defense template consistency check). If this template
      # changes it must be re-verified, so they are included in the trigger.
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so unnecessary runs do not
# pile up during frequent pushes.
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test harness registry sync check (run-all.sh <-> CI <-> directories)
        run: detections/tests/check-harness-sync.sh
      - name: Host triage tool self-test (artex_host_triage.py --self-test, non-rule gate)
        run: detections/tests/triage-selftest.sh
      - name: Defense guide inline Sigma template consistency check (sigma check, conversion matrix, ko/en bodies identical, non-rule gate)
        run: detections/tests/check-defense-template.sh
      - name: Sigma rule reproduction test (sigma check + backend conversion + indicator preservation)
        run: detections/tests/sigma/run.sh
      - name: Sigma real-event matching test (atomic and correlation rules fire on malicious samples/timelines and stay silent on benign ones)
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ convention lint (full validator set + documented criteria)
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma backend portability test (verify correlation rules convert on multiple backends)
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata rule reproduction test (synthesize pcap -> suricata -r -> assert alert count)
        run: detections/tests/suricata/run.sh
      - name: ATT&CK layer <-> rule consistency test
        run: detections/tests/attack/run.sh
      - name: Detection indicators <-> upstream source match test (guard against upstream resync drift)
        run: detections/tests/indicators/run.sh
      - name: Indicator MISP export <-> CSV sync test (validate MISP format with pymisp)
        run: detections/tests/misp/run.sh
