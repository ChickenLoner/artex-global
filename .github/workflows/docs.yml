name: docs
# On every push and PR, checks that repo-internal link and image references in tracked Markdown
# docs point to files that exist, and that anchor links (#heading) point to headings that actually
# exist in the target document, so broken links, images, and anchors do not get merged. The files a
# link points to can be anywhere in the repo (e.g. ../LICENSE, screenshots/en/*.png), so this runs
# on every change with no paths filter. External URLs (http/https/mailto) depend on the network and
# are flaky, so they are not checked — scripts/check-doc-links.py looks only at internal references.
# It uses only the Python standard library and never touches the network, so it finishes
# deterministically and does not flicker because of external factors such as Docker Hub rate
# limits. ci.yml covers the Go build, static analysis, and tests, detections.yml detection rule
# reproduction, and web.yml the Korean UI build.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so unnecessary runs do not pile up.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner and the script uses only the standard
      # library, so no separate install step is needed. Run with -I to isolate user site and
      # environment.
      - name: Docs internal link, image, and anchor integrity check
        run: python3 -I scripts/check-doc-links.py
