name: web
# On every push and PR, run the static-export build of the Korean UI (web/) to catch frontend
# regressions before merge. The release workflow (release.yml) builds web only on tags (v*), and
# this fork has no tag-push history, so it has never run — this workflow is what verifies everyday
# web changes (TypeScript, React, i18n, next-intl). The Go build and tests are covered by ci.yml,
# so this runs only when web/ changes (paths filter).
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # The static-export build is the merge gate. `NEXT_EXPORT=1 next build` also performs TypeScript
  # type checking because next.config has no typescript.ignoreBuildErrors setting, so any type
  # error or export failure stops this job red and blocks the merge.
  #
  # The biome lint is also a merge gate. After clearing the pre-existing lint debt (G7) that came
  # along from upstream down to 0 (errors 8 -> 0: 6 a11y in the skills tree + 1 package.json
  # formatter + 1 logo.svg noSvgWithoutTitle), the informational step was promoted to a gate. Now
  # if `npm run check` (biome check) reports an error, this job stops red and blocks the merge,
  # preventing a regression that dirties the cleaned-up state again. Warnings and infos do not
  # affect the exit code (biome returns non-zero only at error level), so they do not block merges.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Unit tests (merge gate, vitest)
        # Catches regressions in pure logic (getInitials/formatCurrency, i18n config, statusMeta) and i18n key consistency before merge.
        run: npm run test -- --run
      - name: i18n locale key consistency (merge gate, 6 locales match ko)
        # Checks that the key sets of en/zh/es/ja/th are exactly the same as ko.json (both missing and extra keys fail).
        run: npm run check:i18n
      - name: build:static (merge gate, includes type checking)
        run: npm run build:static
      - name: UI Han-character leak guard (merge gate, zero Chinese in out HTML)
        # The key achievement of this fork is that "no Chinese appears on user-visible screens".
        # This prevents, before merge, regressions where a contributor hardcodes Chinese or a translation is missed.
        # The script finds web/out at the git root by itself, so it is independent of the working directory.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (merge gate, keep lint, format, and a11y errors at 0)
        if: always()
        run: npm run check
