name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the Release

jobs:
  # (1) Static frontend export (done once); the output is reused by each platform's cross-compile
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # (2) Cross-compile for 5 platforms (frontend embedded) + zip packaging
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          # Ed25519 public key (64 hex chars) that one-click update verifies; empty = update disabled.
          ARTEX_UPDATE_PUBKEY: ${{ vars.ARTEX_UPDATE_PUBKEY }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF binaries crash on some Linux kernels, virtualization setups, and security policies.
          # Release uses Go linker stripping and zip compression to prioritize portability.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload the original Linux binary separately so the docker job can reuse it (so the frontend and Go are not rebuilt inside the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # (3) Collect all zips -> create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - name: Sign checksums
        working-directory: dist
        env:
          # PEM-encoded Ed25519 private key (openssl genpkey -algorithm ed25519). Keep it secret;
          # without it the release has no SHA256SUMS.sig and one-click update refuses it.
          ARTEX_UPDATE_SIGNING_KEY: ${{ secrets.ARTEX_UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$ARTEX_UPDATE_SIGNING_KEY" ]; then
            printf '%s\n' "$ARTEX_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/sign.pem"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/sign.pem" -in SHA256SUMS | od -An -vtx1 | tr -d ' \n' > SHA256SUMS.sig
            rm -f "$RUNNER_TEMP/sign.pem"
          else
            echo "::warning::ARTEX_UPDATE_SIGNING_KEY not set; release will not be updatable from the UI"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true

  # (4) Multi-arch image -> push to GitHub Container Registry (ghcr.io) (reuses the Linux binary built by binaries,
  #    installs only tools in the image and places just the binary; arm64 needs to emulate only the apt layer, so the build is much faster)
  #    Login uses the workflow's default GITHUB_TOKEN, so no extra secret is needed. Upstream autumn27/artex (Docker Hub) is
  #    gone and this fork has no push permission to that namespace, so images are published to a ghcr namespace owned by this fork.
  docker:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/jiwoochris/artex-global
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
