name: external-links
# Checks that the external links in tracked Markdown (the incident-reporting contacts in the defense
# guide such as boho.or.kr, privacy.go.kr, pipc.go.kr, and fsec.or.kr, plus CISA KEV, OWASP, SigmaHQ,
# Suricata, MITRE, MISP, the original demo, GitHub badges, and so on) are still alive. Whether an
# external URL is alive depends on the network and remote server policy, so it is flaky and is not
# checked in the internal-link merge gate (docs.yml). This workflow therefore runs only on a weekly
# schedule and on manual dispatch (workflow_dispatch), not on pushes or PRs, so it **does not block
# merges**; if an external link rots or is shut down, the periodic run turns red. docs.yml covers
# internal links and anchors, ci.yml the Go build, analysis, and tests, detections.yml detection
# rules, and web.yml the Korean UI build.
#
# --strict fails only when there is at least one DOWN (404, 410, 5xx, DNS/connection error) that is
# not in the allowlist (scripts/external-links-allowlist.txt). RESTRICTED (bot blocking, rate
# limiting, and similar, where the host is still alive) and ALLOWED (dead links inherited from
# upstream that we cannot fix) do not count as failures, so a red run is a signal that "an external
# link curated by our docs has newly broken — go look." Scheduled workflows run only on the
# default branch (main).
on:
  schedule:
    - cron: "17 0 * * 1" # every Monday at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner and the script uses only the standard
      # library, so no separate install is needed. Run with -I to isolate user site and environment.
      - name: External link liveness check (browser UA, GET, follow redirects, allowlist excluded, non-blocking for merges)
        run: python3 -I scripts/check-external-links.py --strict
